upstream api_upstream {
    keepalive 300;
    server backend:8092;
}

server {
    listen 8092;
    rewrite_log on;
    client_max_body_size 5G;
    client_body_timeout 3000s;
    absolute_redirect off;

    keepalive_timeout 600s;  # Keep connections alive for 600 seconds

    location = / {
        rewrite ^ /app redirect;
    }

    location ^~ /app {
        alias /var/www/html/app;
        try_files $uri $uri/ /app/index.html;
    }

    location ^~ /player {
        alias /var/www/html/app;
        try_files $uri $uri/ /app/index.html;
    }

    location /app/custom-service-worker.js {
        alias /var/www/html/app/custom-service-worker.js;  # Serve the service worker file directly
        add_header Service-Worker-Allowed '/';
    }

    location /api {
        proxy_pass http://api_upstream/api;
        proxy_buffering off;
        # Increase timeout to allow large file uploads
        proxy_read_timeout 3000s;
        proxy_connect_timeout 3000s;
        proxy_send_timeout 3000s;
    }

    location /assets/ {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Max-Age 3600;
        add_header Access-Control-Expose-Headers Content-Length;
        add_header Access-Control-Allow-Headers Range;

        alias /assets/;
    }
}

error_log /var/log/nginx/error.log debug;
access_log /var/log/nginx/access.log;
